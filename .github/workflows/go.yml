name: Go Build and Lint

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/go.yml'
      - '.golangci.yml'
      - '.dagger/**'
      - 'dagger.toml'
      - 'dagger.lock'
      - 'scripts/ci/**'
  pull_request:
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/go.yml'
      - '.golangci.yml'
      - '.dagger/**'
      - 'dagger.toml'
      - 'dagger.lock'
      - 'scripts/ci/**'
  workflow_dispatch:

# Lint, race tests and the cross-platform build are Dagger checks (dagger.toml):
# `dagger check` runs them the same way on a laptop. This public repository
# stays on GitHub-hosted runners, so each run starts a cold engine.
env:
  DAGGER_VERSION: v1.0.0-beta.24
  DAGGER_ENGINE: image://registry.dagger.io/engine:v1.0.0-beta.24
  DAGGER_NO_NAG: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install the Dagger CLI
        run: ./scripts/ci/install-dagger.sh "$RUNNER_TEMP/dagger-bin"
      - name: Run every check
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/dagger-bin:$PATH"
          dagger check --progress=report
