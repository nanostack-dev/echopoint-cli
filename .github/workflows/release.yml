name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  # Floating major tag consumers pin the composite action at
  # (`uses: nanostack-dev/echopoint-cli@v1`). This is the ACTION's contract
  # version and is deliberately independent of the CLI's semver — the CLI is
  # still on v0.x. Bump this by hand only when action.yml changes in a way that
  # breaks existing callers (removing/renaming an input, changing a default).
  ACTION_MAJOR_TAG: v1

jobs:
  create-tag:
    name: Create Version Tag
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      release: ${{ steps.tag.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest tag
        id: get_latest
        run: |
          # Highest X.Y.Z release tag. Excludes the floating major action tag
          # (e.g. v1) and is robust to squashed history, where `git describe`
          # cannot see pre-squash tags and falls back to v0.0.0.
          latest_tag=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          [ -z "$latest_tag" ] && latest_tag="v0.0.0"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "Latest tag: $latest_tag"

      - name: Calculate new version
        id: tag
        run: |
          latest_tag="${{ steps.get_latest.outputs.latest_tag }}"

          # Parse the current version components.
          if [[ $latest_tag =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            range="${latest_tag}..HEAD"
          else
            major=0
            minor=0
            patch=0
            range="HEAD"
          fi

          # Conventional Commits drive the semver bump:
          #   - breaking change (type! or "BREAKING CHANGE") -> major
          #   - feat                                          -> minor
          #   - fix | perf                                    -> patch
          #   - anything else only (docs/chore/ci/refactor)   -> no release
          commits=$(git log --no-merges --pretty=format:'%B' "$range")
          if [ -z "$commits" ]; then
            echo "No commits since ${latest_tag}; skipping release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bump="none"
          if grep -qE '^[a-zA-Z]+(\([^)]+\))?!:' <<<"$commits" \
            || grep -qE 'BREAKING[ -]CHANGE' <<<"$commits"; then
            bump="major"
          elif grep -qE '^feat(\([^)]+\))?!?:' <<<"$commits"; then
            bump="minor"
          elif grep -qE '^(fix|perf)(\([^)]+\))?!?:' <<<"$commits"; then
            bump="patch"
          fi

          if [ "$bump" = "none" ]; then
            echo "No feat/fix/perf/breaking commits since ${latest_tag}; skipping release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new_tag="v${major}.${minor}.${patch}"

          # Guard against collision with an existing tag.
          if git rev-parse "$new_tag" >/dev/null 2>&1; then
            echo "::error::Computed tag $new_tag already exists; bump manually." >&2
            exit 1
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"
          echo "Bump: $bump -> $new_tag (from $latest_tag)"

      - name: Create and push tag
        if: steps.tag.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.tag.outputs.new_tag }}
          git push origin ${{ steps.tag.outputs.new_tag }}

  goreleaser:
    name: Release
    runs-on: ubuntu-latest
    needs: create-tag
    if: needs.create-tag.outputs.release == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  move-major-tag:
    name: Move floating action tag
    runs-on: ubuntu-latest
    needs: [create-tag, goreleaser]
    if: needs.create-tag.outputs.release == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Consumers pin the composite action at the floating major tag, so a
      # change to action.yml reaches nobody until that tag is repointed. This
      # used to be a manual step that was silently skipped: the CLI dropped the
      # --runner-binary flag in b9b673c while v1 stayed frozen on a commit that
      # still passed it, and every flow suite died on `unknown flag` for two
      # weeks behind a continue-on-error.
      - name: Repoint floating major tag at the released commit
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Tag HEAD rather than the semver tag by name: create-tag applied that
          # tag to this same commit, and HEAD needs no tag fetch to resolve.
          git tag -f "$ACTION_MAJOR_TAG" HEAD
          git push --force origin "refs/tags/$ACTION_MAJOR_TAG"

          echo "\`$ACTION_MAJOR_TAG\` -> ${{ needs.create-tag.outputs.new_tag }} ($(git rev-parse --short HEAD))" \
            >> "$GITHUB_STEP_SUMMARY"
