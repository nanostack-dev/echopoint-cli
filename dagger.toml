# echopoint-cli's CI as Dagger checks (.github/workflows/go.yml).
# `dagger check` runs them the same way on a laptop and in CI.
[modules.go]
source = "dagger.io/go"

[modules.go.settings]
# The race detector needs cgo, so the tests run on a Debian Go image.
base = "golang:1.26.10-bookworm"
# -buildvcs=false: the module mounts a placeholder .git, which git cannot read.
goflags = "-race -buildvcs=false"
# CI never ran go generate; the generated code is checked in.
generate = ["!**"]

[modules.golangci-lint]
source = "dagger.io/go/golangci-lint"

[modules.cli]
source = ".dagger/modules/cli"

[modules.cli.settings]
goImage = "golang:1.26.10-bookworm"
