        user_agent:
          description: Value of the request's User-Agent header, the same value as in `headers` (header names match case-insensitively). Absent when the request carried no User-Agent, or an empty one.
          type:
            - string
            - "null"
          examples:
            - GitHub-Hookshot/abc123
        ip_address:
          description: IP address of the request sender.
          type: string
