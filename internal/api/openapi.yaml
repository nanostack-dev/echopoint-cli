openapi: 3.1.1
info:
  title: Echopoint Webhook Testing Service API
  description: "API for webhook testing and monitoring service. \nProvides endpoints for creating webhook endpoints, capturing requests,\nand analyzing webhook traffic with real-time streaming and analytics."
  version: 1.1.0
paths:
  /webhooks:
    parameters:
      - $ref: '#/components/parameters/RequiredOrganizationIDHeader'
    get:
      tags:
        - Webhook
      summary: List Webhook Endpoints
      description: Lists webhook endpoints for the current organization.
      operationId: listWebhooks
      responses:
        "200":
          description: Webhook endpoints retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookListResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      security:
        - BearerAuth:
            - webhooks:read
        - ApiKeys:
            - webhooks:read
      x-ai-description: List webhook endpoints in the organization.
      x-ai-tool: true
    post:
      tags:
        - Webhook
      summary: Create Webhook Endpoint
      description: Creates a new webhook endpoint for receiving webhook requests.
      operationId: createWebhook
      requestBody:
        description: Webhook endpoint details.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
        required: true
      responses:
        "201":
          description: Webhook endpoint created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "409":
          $ref: '#/components/responses/Conflict'
      security:
        - BearerAuth:
            - webhooks:create
        - ApiKeys:
            - webhooks:create
      x-ai-tool: true
  /webhooks/{id}:
    parameters:
      - $ref: '#/components/parameters/WebhookIdParameter'
      - $ref: '#/components/parameters/RequiredOrganizationIDHeader'
    get:
      tags:
        - Webhook
      summary: Get Webhook Endpoint
      description: Retrieves details of a specific webhook endpoint.
      operationId: getWebhook
      responses:
        "200":
          description: Webhook endpoint details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        "404":
          $ref: '#/components/responses/NotFound'
      security:
        - BearerAuth:
            - webhooks:read
        - ApiKeys:
            - webhooks:read
      x-ai-tool: true
    delete:
      tags:
        - Webhook
      summary: Delete Webhook Endpoint
      description: Deletes a webhook endpoint. This is a destructive operation.
      operationId: deleteWebhook
      responses:
        "204":
          description: Webhook endpoint deleted successfully or already deleted.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      security:
        - BearerAuth:
            - webhooks:delete
        - ApiKeys:
            - webhooks:delete
      x-ai-tool: true
  /resources/search:
    parameters:
      - $ref: '#/components/parameters/RequiredOrganizationIDHeader'
    post:
      tags:
        - Resources
      summary: Search Resources
      description: Cross-domain resource discovery across persisted flow-relevant resources.
      operationId: searchResources
      requestBody:
        description: Search criteria for cross-domain resources.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceSearchRequest'
        required: true
      responses:
        "200":
          description: Domain-grouped resource search results retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSearchResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      security:
        - BearerAuth: []
        - ApiKeys: []
      x-ai-tool: true
  /administrations/resource-search/resync:
    parameters:
      - $ref: '#/components/parameters/RequiredOrganizationIDHeader'
    post:
      tags:
        - Administration
      summary: Resync Resource Search Documents
      description: |-
        Wipes and rebuilds the `resource_search_documents` projection from canonical tables across every tenant, and returns a report — grouped by organization — of the rows that had drifted and were corrected (missing rows added back, stale rows removed).
        Reserved for operator use. The caller must authenticate with a Clerk session JWT whose `admin` claim resolves to `true` (configured in the Clerk JWT template from `user.public_metadata.admin`). API-key authentication is not accepted on admin routes. The operation runs synchronously inside a single transaction and may take time on large databases.
      operationId: resyncResourceSearch
      responses:
        "200":
          description: Resync completed successfully; body reports what drifted and was corrected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSearchResyncReport'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      security:
        - BearerAuth: []
      x-ai-danger: Admin route - requires a privileged session.
  /administrations/flow-schedules/{scheduleId}/run:
    parameters:
      - name: scheduleId
        in: path
        description: The unique identifier of the schedule to run immediately.
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/RequiredOrganizationIDHeader'
    post:
      tags:
        - Administration
      summary: Run Flow Schedule Now
      description: |-
        Runs a single flow schedule immediately instead of waiting for its next cron tick.
        Processes the schedule inline — creates the occurrence, advances next_run_at, and
        launches pending run items. Reserved for operator use; the caller must authenticate
        with a Clerk session JWT whose `admin` claim is `true`. API-key authentication is
        not accepted on admin routes.
      operationId: runFlowScheduleNow
      responses:
        "202":
          description: Schedule run completed.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
      security:
        - BearerAuth: []
      x-ai-danger: Admin route - requires a privileged session.
  /webhooks/{id}/requests/search:
    parameters:
      - $ref: '#/components/parameters/WebhookIdParameter'
      - $ref: '#/components/parameters/RequiredOrganizationIDHeader'
    post:
      tags:
        - Webhook
      summary: Search Webhook Requests
      description: Server-side search with pagination, filtering and sorting for a webhook's requests.
      operationId: searchWebhookRequests
      requestBody:
        description: Search criteria for webhook requests.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequestSearchRequest'
        required: true
      responses:
        "200":
          description: Search results retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookRequestListResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
      security:
        - BearerAuth:
            - webhooks:read
        - ApiKeys:
            - webhooks:read
      x-ai-tool: true
  /webhooks/search:
    parameters:
      - $ref: '#/components/parameters/RequiredOrganizationIDHeader'
    post:
      tags:
        - Webhook
      summary: Search Webhook Endpoints
      description: Server-side search with pagination, filtering and sorting for webhook endpoints.
      operationId: searchWebhooks
      requestBody:
        description: Search criteria for webhook endpoints.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSearchRequest'
        required: true
      responses:
        "200":
          description: Webhook endpoint search results retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookListResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      security:
        - BearerAuth:
            - webhooks:read
        - ApiKeys:
            - webhooks:read
      x-ai-tool: true
  /webhooks/{id}/stream:
    parameters:
      - $ref: '#/components/parameters/WebhookIdParameter'
      - $ref: '#/components/parameters/RequiredOrganizationIDHeader'
      - name: limit
        in: query
        required: true
        schema:
          type: integer
          format: int32
          default: 100
          minimum: 1
          maximum: 100
    get:
      tags:
        - Webhook
      summary: Stream Webhook Requests
      description: Stream webhook requests in real-time using Server-Sent Events.
      operationId: streamWebhookRequests
      responses:
        "200":
          description: Server-Sent Events stream of webhook requests.
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: '#/components/responses/NotFound'
      security:
        - BearerAuth:
            - webhooks:read
        - ApiKeys:
            - webhooks:read
      x-ai-danger: SSE stream - long-lived, incompatible with request/response tools.
  /webhooks/{id}/analytics/requests/volumes:
    parameters:
      - $ref: '#/components/parameters/WebhookIdParameter'
      - $ref: '#/components/parameters/RequiredOrganizationIDHeader'
    get:
      tags:
        - Analytics
      summary: Get Request Volumes
      description: Returns request counts over time for the selected datetime range.
      operationId: getWebhookRequestVolumes
      parameters:
        - name: from
          in: query
          description: Start datetime for analytics data (ISO 8601 format).
          required: true
          schema:
            type: string
            format: date-time
            examples:
              - 2023-01-01T00:00:00Z
        - name: to
          in: query
          description: End datetime for analytics data (ISO 8601 format).
          required: true
          schema:
            type: string
            format: date-time
            examples:
              - 2023-01-02T00:00:00Z
      responses:
        "200":
          description: Request volumes time series retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestVolumesResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
      security:
        - BearerAuth:
            - webhooks:read
        - ApiKeys:
            - webhooks:read
      x-ai-tool: true
  /webhooks/{id}/analytics/requests/methods:
    parameters:
      - $ref: '#/components/parameters/WebhookIdParameter'
      - $ref: '#/components/parameters/RequiredOrganizationIDHeader'
    get:
      tags:
        - Analytics
      summary: Get Method Distribution
      description: Returns distribution of HTTP methods for the selected datetime range.
      operationId: getWebhookMethodDistribution
      parameters:
        - name: from
          in: query
          description: Start datetime for analytics data (ISO 8601 format).
          required: true
          schema:
            type: string
            format: date-time
            examples:
              - 2023-01-01T00:00:00Z
        - name: to
          in: query
          description: End datetime for analytics data (ISO 8601 format).
          required: true
          schema:
            type: string
            format: date-time
            examples:
              - 2023-01-02T00:00:00Z
      responses:
        "200":
          description: Method distribution retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethodDistributionResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
      security:
        - BearerAuth:
            - webhooks:read
        - ApiKeys:
            - webhooks:read
      x-ai-tool: true
  /webhook/{id}:
    parameters:
      - $ref: '#/components/parameters/WebhookIdParameter'
    get:
      tags:
        - Webhook
      summary: Receive Webhook via GET
      description: Receives and processes webhook requests sent via GET method.
      operationId: receiveWebhookGet
      requestBody:
        $ref: '#/components/requestBodies/WebhookAnyPayload'
      responses:
        "200":
          description: Webhook request received and processed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        "404":
          $ref: '#/components/responses/NotFound'
      x-ai-danger: Public webhook ingestion - data-plane endpoint, not a control action.
    put:
      tags:
        - Webhook
      summary: Receive Webhook via PUT
      description: Receives and processes webhook requests sent via PUT method.
      operationId: receiveWebhookPut
      requestBody:
        $ref: '#/components/requestBodies/WebhookAnyPayload'
      responses:
        "200":
          description: Webhook request received and processed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        "404":
          $ref: '#/components/responses/NotFound'
      x-ai-danger: Public webhook ingestion - data-plane endpoint, not a control action.
    post:
      tags:
        - Webhook
      summary: Receive Webhook via POST
      description: Receives and processes webhook requests sent via POST method.
      operationId: receiveWebhookPost
      requestBody:
        $ref: '#/components/requestBodies/WebhookAnyPayload'
      responses:
        "200":
          description: Webhook request received and processed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        "404":
          $ref: '#/components/responses/NotFound'
      x-ai-danger: Public webhook ingestion - data-plane endpoint, not a control action.
    delete:
      tags:
        - Webhook
      summary: Receive Webhook via DELETE
      description: Receives and processes webhook requests sent via DELETE method.
      operationId: receiveWebhookDelete
      requestBody:
        $ref: '#/components/requestBodies/WebhookAnyPayload'
      responses:
        "200":
          description: Webhook request received and processed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        "404":
          $ref: '#/components/responses/NotFound'
      x-ai-danger: Public webhook ingestion - data-plane endpoint, not a control action.
    patch:
      tags:
        - Webhook
      summary: Receive Webhook via PATCH
      description: Receives and processes webhook requests sent via PATCH method.
      operationId: receiveWebhookPatch
      requestBody:
        $ref: '#/components/requestBodies/WebhookAnyPayload'
      responses:
        "200":
          description: Webhook request received and processed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        "404":
          $ref: '#/components/responses/NotFound'
      x-ai-danger: Public webhook ingestion - data-plane endpoint, not a control action.
  /flows/{id}/launch:
    parameters:
      - name: id
        in: path
        description: The unique identifier of the collection.
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/RequiredOrganizationIDHeader'
    post:
      tags:
        - Flows
      summary: Launch a flow execution
      description: |
        Launches a flow execution asynchronously and returns the created execution.
        Real-time updates can be consumed separately from the execution stream endpoint.
        Specify a version_id in the request body to run a specific published version;
        omit it to run the current (mutable) flow definition.

        Each organization may launch at most its license's `max_executions_per_day`
        executions in any 24 hours, counting every trigger and runner. A launch past
        it answers 429 `DAILY_EXECUTION_LIMIT_EXCEEDED`; an idempotent replay of an
        earlier launch does not count.
      operationId: launchFlow
      parameters:
        - name: id
          in: path
          description: The unique identifier of the collection.
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: |
            Optional stable key for idempotent launches (e.g. CI retries). Idempotency is scoped
            by organization, flow, environment key, version ID, runner type, trigger type, and the
            key digest. A matching launch returns the original execution; reusing the key
            with different scoped parameters returns 409 Conflict.
          required: false
          schema:
            type: string
            maxLength: 255
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaunchFlowRequest'
        required: true
      responses:
        "202":
          description: |
            Flow execution accepted. Cloud/self-hosted runners start asynchronously. An ephemeral
            caller claims its one-shot Job at POST /runner/ephemeral/executions/{executionId}/claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaunchFlowAcceptedResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          description: Flow execution failed to start
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
        - BearerAuth:
            - flows:execute
        - ApiKeys:
            - flows:execute
      x-ai-description: Launch (run) a flow execution asynchronously by flow id. Returns the created execution. Use when the user asks to run, trigger, or test a flow.
      x-ai-tool: true
  /runner/ephemeral/executions/{executionId}/claim:
    parameters:
      - name: executionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/RequiredOrganizationIDHeader'
    post:
      tags:
        - Runner
      summary: Claim one ephemeral Job
      description: |
        Atomically claims the Job for this execution and returns its runnable payload and
        one-job token once. A repeated or concurrent claim returns 409; the caller must
        inspect execution state rather than run the flow a second time.
      operationId: claimEphemeralJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EphemeralJobClaimRequest'
        required: true
      responses:
        "200":
          description: Claimed Job and one-job token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EphemeralJobClaimResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth:
            - flows:execute
        - ApiKeys:
            - flows:execute
      x-ai-danger: Runner protocol - machine-to-machine, not an agent action.
  /runner/ephemeral/executions/{executionId}/complete:
    parameters:
      - name: executionId
        in: path
        description: The unique identifier of the ephemeral execution.
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/RequiredOrganizationIDHeader'
    post:
      tags:
        - Runner
      summary: Complete an ephemeral execution
      description: |
        Reports the terminal result for an ephemeral execution produced by a caller-owned
        runner. Sibling to the self-hosted POST /runner/jobs/{jobId}/complete, but execution-keyed
        and claim/lease-free (an ephemeral runner never claims a job). Only valid for executions
        with `runner_type = ephemeral` belonging to the requesting organization. Duplicate
        publication of the same payload is idempotent; a different payload for an already-terminal
        execution returns 409 Conflict. The response includes the terminal execution and node
        summaries so the CLI/action can report without an extra read.
      operationId: completeEphemeralExecution
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EphemeralCompletionRequest'
        required: true
      responses:
        "200":
          description: Ephemeral result accepted; terminal execution and node summary returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EphemeralCompletionResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - ApiKeys:
            - runner:complete
        - BearerAuth:
            - flows:execute
      x-ai-danger: Runner protocol - machine-to-machine, not an agent action.
  /runners:
    parameters:
      - $ref: '#/components/parameters/RequiredOrganizationIDHeader'
    get:
      tags:
        - Runner
      summary: List live self-hosted runners
      description: |
        Returns the currently live self-hosted runners observed for the active organization,
        based on Redis-backed presence refreshed by runner poll and heartbeat traffic.
        Cloud workers are never listed: a Cloud container is a transient worker of the
        shared pool, not a runner that the organization operates.
      operationId: listLiveRunners
      responses:
        "200":
          description: Live self-hosted runners for the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveRunnerListResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth:
            - flows:read
        - ApiKeys:
            - flows:read
      x-ai-tool: true
  /runner/jobs/next:
    post:
      tags:
        - Runner
      summary: Claim the next runner job
      description: |
        Long-polls for work, refreshes runner liveness, and atomically claims one queued runner job
        when capacity is available.
      operationId: nextRunnerJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunnerJobNextRequest'
        required: true
      responses:
        "200":
          description: Claimed runner job payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerJobPayload'
        "204":
          description: No runner job available before timeout.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - ApiKeys:
            - runner:claim
      x-ai-danger: Runner protocol - machine-to-machine, not an agent action.
  /runner/jobs/{jobId}/payload:
    parameters:
      - $ref: '#/components/parameters/RunnerJobIDParameter'
    get:
      tags:
        - Runner
      summary: Fetch the Cloud job payload
      description: |
        Returns the flow snapshot, runner inputs, referenced flows, and Cloud
        duration for a Cloud job. Authenticate with the job token. The token is
        never persisted. Self-hosted and ephemeral jobs are not served here.

        The payload is single-use. The first call claims it; a later call is
        refused with 409. Message delivery to a Cloud worker is at-least-once,
        so a redelivered job can reach a second worker that holds the same
        valid token, and a Cloud job must never run twice.
      operationId: getCloudJobPayload
      responses:
        "200":
          description: Cloud job payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudJobPayload'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - JobToken: []
      x-ai-danger: Runner protocol - machine-to-machine, not an agent action.
  /runner/jobs/{jobId}/complete:
    parameters:
      - $ref: '#/components/parameters/RunnerJobIDParameter'
    post:
      tags:
        - Runner
      summary: Complete a claimed runner job
      description: |
        Accepts a one-shot terminal runner completion report for a previously claimed runner job.
        Cloud and Ephemeral jobs authenticate with X-Job-Token. Self-hosted jobs keep X-Api-Key.
        Do not send both headers.
      operationId: completeRunnerJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunnerJobCompletionRequest'
        required: true
      responses:
        "204":
          description: Runner job completion accepted.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - ApiKeys:
            - runner:complete
        - JobToken: []
