    UpdateRequestRequest:
      type: object
      properties:
        name:
          type: string
          description: Request name
          example: "Updated Request Name"
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          description: Optional request description
        method:
          $ref: "#/components/schemas/HttpMethod"
        url:
          type: string
          description: |
