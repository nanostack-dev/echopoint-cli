      - name: collectionId
        in: path
        required: true
        description: The unique identifier of the collection.
        schema:
          type: string
          format: uuid
      - name: folderId
        in: path
        required: true
        description: The unique identifier of the folder.
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/RequiredOrganizationIDHeader"
    put:
      summary: Update Folder
      description: Updates a folder.
      operationId: updateFolder
      tags: [Collections]
      security:
        - BearerAuth: [collections:update]
      requestBody:
        description: Folder update details.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFolderRequest"
      responses:
        "200":
          description: Folder updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionFolder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete Folder
      description: Deletes a folder (requests moved to collection root).
      operationId: deleteFolder
      tags: [Collections]
      security:
        - BearerAuth: [collections:delete]
      responses:
        "204":
          description: Folder deleted successfully or already deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /collections/{id}/requests:
    parameters:
      - name: id
        in: path
        required: true
        description: The unique identifier of the collection.
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/RequiredOrganizationIDHeader"
    get:
      summary: List Collection Requests
      description: Returns paginated requests for a collection, optionally filtered by folder and search query.
      operationId: listCollectionRequests
      tags: [Collections]
      security:
        - BearerAuth: [collections:read]
      parameters:
        - name: folder_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Restrict results to a specific folder. Omit to list root-level requests only.
        - name: include_nested
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true and folder_id is omitted, include requests nested in folders as well as root-level requests.
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search requests by name or URL.
        - $ref: "#/components/parameters/LimitParameter"
        - $ref: "#/components/parameters/OffsetParameter"
      responses:
        "200":
          description: Collection requests returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionRequestListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Add Request
      description: Adds a request to a collection.
      operationId: addRequest
      tags: [Collections]
      security:
        - BearerAuth: [collections:create]
      requestBody:
        description: Request creation details.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequestRequest"
      responses:
        "201":
          description: Request created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /collections/{collectionId}/requests/{requestId}:
    parameters:
      - name: collectionId
        in: path
        required: true
        description: The unique identifier of the collection.
        schema:
          type: string
          format: uuid
      - name: requestId
        in: path
        required: true
        description: The unique identifier of the request.
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/RequiredOrganizationIDHeader"
    get:
      summary: Get Request
      description: Returns a single request from a collection.
      operationId: getCollectionRequest
      tags: [Collections]
      security:
        - BearerAuth: [collections:read]
      responses:
        "200":
          description: Request returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Update Request
      description: Updates a request.
      operationId: updateRequest
      tags: [Collections]
      security:
        - BearerAuth: [collections:update]
      requestBody:
        description: Request update details.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRequestRequest"
      responses:
        "200":
          description: Request updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete Request
      description: Deletes a request.
      operationId: deleteRequest
      tags: [Collections]
      security:
        - BearerAuth: [collections:delete]
      responses:
        "204":
          description: Request deleted successfully or already deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /collections/{collectionId}/requests/{requestId}/execute:
    parameters:
      - name: collectionId
        in: path
        required: true
        description: The unique identifier of the collection.
        schema:
          type: string
          format: uuid
      - name: requestId
        in: path
        required: true
        description: The unique identifier of the request.
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/RequiredOrganizationIDHeader"
    post:
      summary: Execute Request
      description: Executes the current request draft server-side so upstream responses remain visible even when the target API does not expose browser CORS headers.
      operationId: executeCollectionRequest
      tags: [Collections]
      security:
        - BearerAuth: [collections:update]
      requestBody:
        description: Optional unsaved request draft overrides to execute.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteRequestRequest"
      responses:
        "200":
          description: Request executed successfully, including upstream 4xx and 5xx responses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutedRequestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /collections/{collectionId}/requests/{requestId}/openapi-sync-history:
    parameters:
      - name: collectionId
        in: path
        required: true
        description: The unique identifier of the collection.
        schema:
          type: string
          format: uuid
      - name: requestId
        in: path
        required: true
        description: The unique identifier of the request.
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/RequiredOrganizationIDHeader"
      - $ref: "#/components/parameters/LimitParameter"
      - $ref: "#/components/parameters/OffsetParameter"
    get:
      summary: List Request OpenAPI Sync History
      description: Lists OpenAPI sync changes for the upstream binding currently associated with a request.
      operationId: listCollectionRequestOpenAPISyncHistory
      tags: [Collections]
      security:
        - BearerAuth: [collections:read]
      responses:
        "200":
          description: Request OpenAPI sync history returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAPISyncChangeListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /collections/import/openapi:
    parameters:
      - $ref: "#/components/parameters/RequiredOrganizationIDHeader"
    post:
      summary: Import from OpenAPI
      description: Imports a collection from an OpenAPI specification.
      operationId: importFromOpenAPI
      tags: [Collections]
      security:
        - BearerAuth: [collections:create]
      requestBody:
        description: OpenAPI spec to import.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportOpenAPIRequest"
      responses:
        "201":
          description: Collection imported successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAPIImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /flows/{id}/environments:
    parameters:
      - name: id
