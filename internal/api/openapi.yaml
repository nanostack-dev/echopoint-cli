    ExecuteRequestRequest:
      allOf:
        - $ref: "#/components/schemas/UpdateRequestRequest"
        - type: object
          properties:
            environment_key:
              type: string
              nullable: true
              description: Optional named organization environment override. Base organization variables are always loaded.

    ExecutedRequestResponse:
      type: object
      properties:
        request_method:
          $ref: "#/components/schemas/HttpMethod"
        request_url:
          type: string
          description: Fully resolved request URL used by server-side execution.
        request_headers:
          type: object
          additionalProperties:
            type: string
          description: Fully resolved request headers sent upstream.
        request_body:
          nullable: true
          description: Fully resolved request body sent upstream.
        response_status_code:
          type: integer
          description: Upstream HTTP status code.
        response_headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Upstream response headers.
        response_body:
          type: string
          description: Upstream response body as text.
        response_body_parsed:
          nullable: true
          additionalProperties: true
          description: Parsed response body when the content type is JSON.
        duration_ms:
          type: integer
          format: int64
          description: Total server-side execution duration in milliseconds.
      required:
        - request_method
        - request_url
        - request_headers
        - response_status_code
        - response_headers
        - response_body
        - duration_ms

    CollectionRequestResponseSpec:
      type: object
      nullable: true
      properties:
        primary_status_code:
          type: integer
          nullable: true
          description: Preferred success status code for this request's response.
          example: 200
        status_codes:
          type: array
          items:
            type: integer
          description: Known response status codes from the source definition.
          example: [200, 400, 404]
        primary_content_type:
          type: string
          nullable: true
          description: Preferred response media type.
          example: application/json
        content_types:
          type: array
          items:
            type: string
          description: Known response media types from the source definition.
          example: [application/json]
        body_kind:
          allOf:
            - $ref: "#/components/schemas/CollectionRequestResponseBodyKind"
          nullable: true
          example: json
        schema:
          type: object
          nullable: true
          additionalProperties: true
          description: Reduced response schema for the preferred response media type.

    ImportOpenAPIRequest:
      type: object
      properties:
        spec:
          type: object
          nullable: true
          description: OpenAPI spec as JSON object
        options:
          $ref: "#/components/schemas/OpenAPIImportOptions"

    OpenAPIImportOptions:
      type: object
      properties:
        collection_name:
          type: string
          description: Name for the imported collection
          example: "Pet Store API"
        collection_description:
          type: string
          nullable: true
          description: Description for the imported collection
        tags_as_folders:
          type: boolean
          description: Whether to use OpenAPI tags as folder structure
          default: true
        grouping_strategy:
          $ref: "#/components/schemas/OpenAPIGroupingStrategy"
          description: How imported operations should be grouped into folders
          default: tags
        source_url:
          type: string
          format: uri
          nullable: true
          description: Original source URL for the imported spec when available
        use_base_url_variable:
          type: boolean
          description: Whether to rewrite imported request URLs as {{baseUrl}}/path
          default: false
        base_url_variable_name:
          type: string
          description: Variable name to use for rewritten base URLs when enabled. Defaults to baseUrl.
          example: "baseUrl"

    OpenAPIImportResult:
      type: object
      properties:
        collection:
          $ref: "#/components/schemas/Collection"
        requests_created:
          type: integer
          description: Number of requests created from the spec
          example: 15
        folders_created:
          type: integer
          description: Number of folders created from tags
          example: 3
        warnings:
          type: array
          items:
            type: string
          description: List of warnings from the import process
          example:
            - "Skipped endpoint with no operationId"
      required:
        - collection
        - requests_created

    OpenAPIGroupingStrategy:
      type: string
      enum: [none, path, tags]
      description: How imported operations should be grouped into folders
    UpsertOpenAPISyncConfigRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ".*\\S.*"
          description: Optional collection name to apply while updating the OpenAPI sync configuration
        source_url:
          type: string
          format: uri
          description: Source URL used to fetch the upstream OpenAPI document
        grouping_strategy:
          allOf:
            - $ref: "#/components/schemas/OpenAPIGroupingStrategy"
          default: tags
        use_base_url_variable:
          type: boolean
          description: Whether synced request URLs should be rewritten as {{baseUrl}}/path
          default: false
        base_url_variable_name:
          type: string
          description: Variable name to use for rewritten base URLs when enabled. Defaults to baseUrl.
          example: "baseUrl"
      required:
        - source_url
        - grouping_strategy

    RunOpenAPISyncNowRequest:
      type: object
      properties:
        force_reset:
          type: boolean
          default: false
          description: Reapply the current upstream OpenAPI import shape to the collection, overwriting previously skipped user-modified requests and ignoring prior sync hash shortcuts.

    OpenAPISyncConfig:
      type: object
      properties:
        collection_id:
          type: string
          format: uuid
        name:
          type: string
          description: Current collection name used by this OpenAPI sync
        source_url:
          type: string
          format: uri
        sync_interval_minutes:
          type: integer
          description: Current fixed sync interval in minutes
          example: 5
        grouping_strategy:
          $ref: "#/components/schemas/OpenAPIGroupingStrategy"
        use_base_url_variable:
          type: boolean
          description: Whether synced request URLs are rewritten as {{baseUrl}}/path
        base_url_variable_name:
          type: string
          description: Variable name currently used for rewritten base URLs
          example: "baseUrl"
        request_count:
          type: integer
          description: Current number of requests in the synced collection
          example: 616
        last_run_at:
          type: string
          format: date-time
          nullable: true
        next_run_at:
          type: string
          format: date-time
        last_successful_run_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - collection_id
        - name
        - source_url
        - sync_interval_minutes
        - grouping_strategy
        - use_base_url_variable
        - base_url_variable_name
        - request_count
        - next_run_at
        - created_at
        - updated_at

    OpenAPISyncConfigSortField:
      type: string
      enum: ["name", "updated_at", "created_at", "last_run_at", "next_run_at"]
      default: "updated_at"
      description: Field to sort top-level OpenAPI sync config results by.
    OpenAPISyncConfigSearchRequest:
      allOf:
