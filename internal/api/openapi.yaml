  /flows/{id}/launch:
    parameters:
      - name: id
        in: path
        required: true
        description: The unique identifier of the collection.
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/RequiredOrganizationIDHeader"
    post:
      operationId: launchFlow
      x-ai-tool: true
      x-ai-description: "Launch (run) a flow execution asynchronously by flow id. Returns the created execution. Use when the user asks to run, trigger, or test a flow."
      summary: Launch a flow execution
      description: |
        Launches a flow execution asynchronously and returns the created execution.
        Real-time updates can be consumed separately from the execution stream endpoint.
        Specify a version_id in the request body to run a specific published version;
        omit it to run the current (mutable) flow definition.
      tags:
        - Flows
      security:
        - BearerAuth: [flows:execute]
        - ApiKeys: [flows:execute]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LaunchFlowRequest"
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the collection.
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Optional stable key for idempotent launches (e.g. CI retries). Idempotency is scoped
            by organization, flow, environment key, version ID, runner type, trigger type, and the
            key digest. A matching non-terminal ephemeral launch returns the original package; a
            matching terminal one returns the execution summary without a package; reusing the key
            with different scoped parameters returns 409 Conflict.
          schema:
            type: string
            maxLength: 255
      responses:
        "202":
          description: |
            Flow execution accepted. Cloud/self-hosted runners start asynchronously. For
            `runner_type = ephemeral` the caller runs the execution locally from the returned
            execution's flow_snapshot/runner_inputs/referenced_flows, then reports the result to
            POST /runner/ephemeral/executions/{executionId}/complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaunchFlowAcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: Flow execution failed to start
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /runner/ephemeral/executions/{executionId}/complete:
    parameters:
      - name: executionId
        in: path
        required: true
        description: The unique identifier of the ephemeral execution.
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/RequiredOrganizationIDHeader"
    post:
      operationId: completeEphemeralExecution
      x-ai-danger: "Runner protocol - machine-to-machine, not an agent action."
      summary: Complete an ephemeral execution
      description: |
        Reports the terminal result for an ephemeral execution produced by a caller-owned
        runner. Sibling to the self-hosted POST /runner/jobs/{jobId}/complete, but execution-keyed
        and claim/lease-free (an ephemeral runner never claims a job). Only valid for executions
        with `runner_type = ephemeral` belonging to the requesting organization. Duplicate
        publication of the same payload is idempotent; a different payload for an already-terminal
        execution returns 409 Conflict. The response includes the terminal execution and node
        summaries so the CLI/action can report without an extra read.
      tags:
        - Runner
      security:
        - ApiKeys: [runner:complete]
        # A trusted operator's bearer (flows:execute) may also publish ephemeral
        # results: it already launches the execution, so the CLI can run+complete
        # with a single session credential without minting a runner API key.
        - BearerAuth: [flows:execute]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EphemeralCompletionRequest"
      responses:
        "200":
          description: Ephemeral result accepted; terminal execution and node summary returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EphemeralCompletionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

