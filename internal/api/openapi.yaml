      x-ai-danger: Anonymous public projection; visitor data endpoint, not a workspace tool.
components:
  schemas:
    AssistantChatScope:
      description: |
        Which assistant conversation the message belongs to: the general workspace-wide chat or the page-scoped side panel.
      type: string
      enum:
        - general
        - page
    AssistantPageContext:
      description: The page the user has open when asking from the page scope.
      type: object
      required:
        - title
        - pathname
      properties:
        title:
          description: Human title of the open page (e.g. "Webhooks").
          type: string
          maxLength: 200
        pathname:
          description: Route pathname of the open page.
          type: string
          maxLength: 500
        details:
          description: |
            Live per-view details contributed by the page, e.g. the entity a detail page displays ("Endpoint: Stripe events").
          type: array
          items:
            type: string
            maxLength: 300
          maxItems: 20
    AssistantChatRequest:
      type: object
      required:
        - message
        - scope
      properties:
        message:
          description: The user's chat message.
          type: string
          minLength: 1
          maxLength: 4000
        scope:
          $ref: '#/components/schemas/AssistantChatScope'
        page_context:
          $ref: '#/components/schemas/AssistantPageContext'
    AssistantAction:
      description: A navigation action the assistant offers under a reply.
      type: object
      required:
        - label
        - path
      properties:
        label:
          type: string
        path:
          description: Frontend route path the action navigates to.
          type: string
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          description: A machine-readable error code.
          type: string
          examples:
            - VALIDATION_ERROR
        message:
          description: A human-readable error message.
          type: string
          examples:
            - Request validation failed
        field:
          description: The specific field that caused the error (optional).
          type: string
          examples:
            - name
        metadata:
          description: Additional metadata about the error (optional).
          type: object
          additionalProperties: true
          examples:
            - minLength: 2
    ApiErrorResponse:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'
    MembershipStatus:
      type: string
      enum:
        - PENDING_SYNC
        - READY
    CurrentUserOrganizationRole:
      type: object
      required:
        - id
        - name
        - permissions
      properties:
        id:
          description: Role identifier in Nanostack.
          type: string
        name:
          description: Role name.
          type: string
        permissions:
          description: List of resource permission strings attached to the role.
          type: array
          items:
            type: string
    CurrentUserOrganization:
      type: object
      required:
        - id
        - name
        - role
      properties:
        id:
          description: Organization identifier in Nanostack.
          type: string
        name:
          description: Organization display name.
          type: string
        description:
          description: Optional organization description.
          type:
            - string
            - "null"
        role:
          $ref: '#/components/schemas/CurrentUserOrganizationRole'
    CurrentUser:
      type: object
      required:
        - id
        - organizations
      properties:
        id:
          description: Authenticated user identifier from Clerk.
          type: string
        email:
          description: User email from Nanostack product user profile when available.
          type:
            - string
            - "null"
          format: email
        name:
          description: User display name from Nanostack product user profile when available.
          type:
            - string
            - "null"
        user_id:
          description: Nanostack user identifier.
          type:
            - string
            - "null"
        organizations:
          description: 'Every organization the user belongs to, oldest membership first, then by organization id. The first entry is usually the personal organization, but not always: an invitation accepted before the personal organization exists comes first. Empty until the membership is ready.'
          type: array
          items:
            $ref: '#/components/schemas/CurrentUserOrganization'
    CurrentUserResponse:
      type: object
      required:
        - user
        - membership_status
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        membership_status:
          $ref: '#/components/schemas/MembershipStatus'
    ApiKeyIdentity:
      description: 'Identity of an organization API key: the organization it is scoped to and the permissions granted to it.'
      type: object
      required:
        - api_key_id
        - organization_id
        - permissions
      properties:
        api_key_id:
          description: Public identifier of the API key.
          type: string
        organization_id:
          description: Organization the key is scoped to.
          type: string
        permissions:
          description: Permissions granted to the key.
          type: array
          items:
            type: string
    InitResponse:
      description: Response for provisioning initialization.
      type: object
      properties: {}
    ApiKey:
      type: object
      required:
        - id
        - name
        - created_at
        - permissions
      properties:
        id:
          description: Unique identifier for the API key.
          type: string
          examples:
            - organization_apikey_abc123def456
        name:
          description: Human-readable name for the API key.
          type: string
          examples:
            - CI Runner
        created_at:
          description: Timestamp when the API key was created.
          type: string
          format: date-time
        expires_at:
          description: Optional expiration timestamp for the API key.
          type:
            - string
            - "null"
          format: date-time
        last_used_at:
          description: Timestamp when the API key was last used.
          type:
            - string
            - "null"
          format: date-time
        permissions:
          description: Permissions currently assigned to the API key.
          type: array
          items:
            type: string
    ApiKeyCreateRequest:
      type: object
      required:
        - name
        - permissions
      properties:
        name:
          description: Human-readable name for the API key.
          type: string
          minLength: 1
          maxLength: 100
          examples:
            - CI Runner
        expires_in_days:
          description: Optional number of days until the API key expires.
          type:
            - integer
            - "null"
          format: int32
          minimum: 1
          examples:
            - 30
        permissions:
          description: Permissions to assign to the API key.
          type: array
          items:
            type: string
          minItems: 1
    Permission:
      type: object
      required:
        - name
      properties:
        name:
          description: Permission identifier.
          type: string
          examples:
            - flows:read
        description:
          description: Optional human-readable description.
          type:
            - string
            - "null"
        scope_modifier:
          description: Optional scope modifier provided by Nanostack.
          type:
            - string
            - "null"
    ApiKeyPermissionType:
      description: The API key permission catalog to return. `custom` is the full grantable catalog, `runner` is runner-only scopes, and `ci` is the curated preset for CI/CD (flow execution + ephemeral runner completion).
      type: string
      enum:
        - custom
        - runner
        - ci
    ApiKeyCreateResponse:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required:
            - secret
          properties:
            secret:
              description: The full API key secret. This value is only returned once at creation time.
              type: string
              examples:
                - epk_live_xxxxxxxxxxxxxxxxxxxx
    ApiKeyListResponse:
      allOf:
        - $ref: '#/components/schemas/PagedListResponse'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ApiKey'
    ApiKeySortField:
      description: Field to sort API key search results by.
      type: string
      enum:
        - id
        - name
        - created_at
        - last_used_at
      default: created_at
    ApiKeyFilter:
      type: object
      properties:
        ids:
          description: Filter by specific API key IDs.
          type: array
          items:
            type: string
          x-go-type-skip-optional-pointer: true
        names:
          description: Filter by exact API key names.
          type: array
          items:
            type: string
          x-go-type-skip-optional-pointer: true
        last_used_after:
          description: Include API keys last used at or after this timestamp.
          type: string
          format: date-time
        last_used_before:
          description: Include API keys last used at or before this timestamp.
          type: string
          format: date-time
    ApiKeySearchRequest:
      allOf:
        - $ref: '#/components/schemas/SearchRequest'
        - type: object
          properties:
            filter:
              $ref: '#/components/schemas/ApiKeyFilter'
              description: Filter criteria for API keys.
            sort_by:
              $ref: '#/components/schemas/ApiKeySortField'
              description: Field to sort by.
    PermissionListResponse:
      allOf:
        - $ref: '#/components/schemas/PagedListResponse'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Permission'
    AnalyticsPeriod:
      type: string
      enum:
        - 1h
        - 6h
        - 24h
        - 7d
        - 30d
    PagedListResponse:
      type: object
      required:
        - total
        - count
      properties:
        total:
          description: Total number of matching items.
          type: integer
          format: int64
        count:
          description: The number of items returned in this response.
          type: integer
    PaginationRequest:
      type: object
      properties:
        limit:
          description: Maximum number of items per page.
          type: integer
          format: int32
          default: 20
          minimum: 1
          maximum: 100
        offset:
          description: Number of items to skip.
          type: integer
          format: int32
          default: 0
          minimum: 0
    SortDirection:
      type: string
      enum:
        - ASC
        - DESC
      default: DESC
    TagMatchMode:
      description: Whether any or all of the provided tags must match.
      type: string
      enum:
        - any
        - all
      default: any
    SearchRequest:
      description: Generic search request template
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationRequest'
        full_text_search:
          description: Full-text search term to match against searchable fields.
          type: string
        sort_direction:
          $ref: '#/components/schemas/SortDirection'
          description: Sorting direction
    ResourceSearchDomain:
      description: Searchable resource domain included in cross-domain resource search.
      type: string
      enum:
        - collections
        - requests
        - openapi_operations
        - flows
    ResourceSearchType:
      description: Concrete resource type represented by a search result item.
      type: string
      enum:
        - collection
        - request
        - openapi_operation
        - flow
    RequestOrigin:
      description: Normalized provenance for saved request resources.
      type: string
      enum:
        - manual
        - openapi
    ResourceSearchPreset:
      description: Preset that shapes default search behavior for a specific discovery workflow.
      type: string
      enum:
        - top_bar_navigation
        - flow_reference
        - flow_right_click
    ResourceSearchContextLevel:
      description: Controls how much result context is returned for each matched resource.
      type: string
      enum:
        - outline
        - summary
      default: outline
    ResourceSearchScope:
      type: object
      properties:
        collection_ids:
          description: Limits applicable search results to one or more collections when that scope is meaningful.
          type: array
          items:
            type: string
            format: uuid
        flow_id:
          description: Active flow context used to shape flow-aware search behavior.
          type: string
          format: uuid
    ResourceSearchIdentifiers:
      type: object
      required:
        - resource_id
      properties:
        resource_id:
          description: Canonical identifier for the matched resource.
          type: string
          format: uuid
        collection_id:
          description: Related collection identifier when the resource belongs to a collection.
          type:
            - string
            - "null"
          format: uuid
        folder_id:
          description: Related folder identifier when the resource belongs to a folder.
          type:
            - string
            - "null"
          format: uuid
        request_id:
          description: Related request identifier when the resource is or resolves through a saved request.
          type:
            - string
            - "null"
          format: uuid
        openapi_operation_id:
          description: Related OpenAPI operation identifier when the resource is backed by persisted OpenAPI contract data.
          type:
            - string
            - "null"
          format: uuid
        flow_id:
          description: Related flow identifier when the resource is a flow or flow reference target.
          type:
            - string
            - "null"
          format: uuid
    ResourceSearchResultItem:
      type: object
      required:
        - domain
        - type
        - title
        - identifiers
      properties:
        domain:
          $ref: '#/components/schemas/ResourceSearchDomain'
        type:
          $ref: '#/components/schemas/ResourceSearchType'
        title:
          description: Primary display label for the matched resource.
          type: string
        subtitle:
          description: Secondary display text for picker and navigation UIs.
          type:
            - string
            - "null"
        description:
          description: Additional compact context shaped by the requested context level.
          type:
            - string
            - "null"
        identifiers:
          $ref: '#/components/schemas/ResourceSearchIdentifiers'
        request_origin:
          $ref: '#/components/schemas/RequestOrigin'
        method:
          description: HTTP method when the resource represents an executable request or operation.
          type:
            - string
            - "null"
        path:
          description: Indexed path, route, or hierarchical location text for the resource.
          type:
            - string
            - "null"
        url:
          description: Indexed URL when relevant to the matched resource.
          type:
            - string
            - "null"
    ResourceSearchResultGroup:
      allOf:
        - $ref: '#/components/schemas/PagedListResponse'
        - type: object
          required:
            - domain
            - items
          properties:
            domain:
              $ref: '#/components/schemas/ResourceSearchDomain'
            items:
              type: array
              items:
                $ref: '#/components/schemas/ResourceSearchResultItem'
    ResourceSearchRequest:
      allOf:
        - $ref: '#/components/schemas/SearchRequest'
        - type: object
          required:
            - domains
          properties:
            domains:
              description: Domains to include in this search request.
              type: array
              items:
                $ref: '#/components/schemas/ResourceSearchDomain'
              minItems: 1
            preset:
              $ref: '#/components/schemas/ResourceSearchPreset'
            context_level:
              $ref: '#/components/schemas/ResourceSearchContextLevel'
            scope:
              $ref: '#/components/schemas/ResourceSearchScope'
    ResourceSearchResponse:
      type: object
      required:
        - groups
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ResourceSearchResultGroup'
    ResourceSearchDriftDocument:
      description: A single resource_search_documents row that drifted from its canonical source.
      type: object
      required:
        - organizationId
        - domain
        - resourceType
        - resourceId
      properties:
        organizationId:
          type: string
        domain:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
    ResourceSearchOrgResyncReport:
      description: Per-organization summary of what the resync corrected.
      type: object
      required:
        - organizationId
        - addedCount
        - removedCount
        - added
        - removed
        - sampleTruncated
      properties:
        organizationId:
          type: string
        addedCount:
          description: Total canonical rows that were missing and inserted back for this org.
          type: integer
          format: int64
        removedCount:
          description: Total stale rows that were present but unexpected and deleted for this org.
          type: integer
          format: int64
        added:
          description: Bounded sample of the added rows (capped at sampleLimitPerDirection).
          type: array
          items:
            $ref: '#/components/schemas/ResourceSearchDriftDocument'
        removed:
          description: Bounded sample of the removed rows (capped at sampleLimitPerDirection).
          type: array
          items:
            $ref: '#/components/schemas/ResourceSearchDriftDocument'
        sampleTruncated:
          description: True when addedCount+removedCount exceeds the returned sample size.
          type: boolean
    ResourceSearchResyncReport:
      description: Result of an admin resync — what drifted and was corrected, grouped by organization.
      type: object
      required:
        - totalAdded
        - totalRemoved
        - organizationCount
        - sampleLimitPerDirection
        - organizations
      properties:
        totalAdded:
          type: integer
          format: int64
        totalRemoved:
          type: integer
          format: int64
        organizationCount:
          description: Number of organizations that had drift corrected.
          type: integer
        sampleLimitPerDirection:
          description: Max added/removed rows returned per org per direction.
          type: integer
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/ResourceSearchOrgResyncReport'
    Webhook:
      type: object
      required:
        - id
        - name
        - url
        - created_at
        - updated_at
        - request_count
      properties:
        id:
          description: Unique identifier for the webhook endpoint.
          type: string
          examples:
            - wh_abc123def456
        name:
          description: Human-readable name for the webhook endpoint.
          type: string
          examples:
            - My API Webhook
        url:
          description: The URL where webhook requests are received.
          type: string
          examples:
            - https://api.echopoint.com/webhook/wh_abc123def456
        created_at:
          description: Timestamp when the webhook endpoint was created.
          type: string
          format: date-time
        updated_at:
          description: Timestamp when the webhook endpoint was last updated.
          type: string
          format: date-time
        request_count:
          description: Total number of requests received by this webhook endpoint.
          type: integer
          examples:
            - 1247
    WebhookSortField:
      description: Field to sort webhook endpoint search results by.
      type: string
      enum:
        - name
        - created_at
        - updated_at
        - request_count
      default: created_at
    WebhookFilter:
      type: object
      properties:
        ids:
          description: Filter by specific webhook IDs.
          type: array
          items:
            type: string
          x-go-type-skip-optional-pointer: true
        names:
