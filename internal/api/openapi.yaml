          description: Identifier of the attached OpenAPI sync config when this collection is sync-managed
          type:
            - string
            - "null"
          format: uuid
        folder_count:
          description: Total number of folders in the collection
          type: integer
          examples:
            - 12
        request_count:
          description: Total number of requests in the collection
          type: integer
          examples:
            - 438
        folders:
          description: Lightweight collection responses return an empty array; use the dedicated folders endpoint for content.
          type: array
          items:
            $ref: '#/components/schemas/CollectionFolder'
        requests:
          description: Lightweight collection responses return an empty array; use the dedicated requests endpoint for content.
          type: array
          items:
            $ref: '#/components/schemas/CollectionRequest'
