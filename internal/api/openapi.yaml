  /assistant/chat:
    parameters:
      - $ref: "#/components/parameters/RequiredOrganizationIDHeader"
    post:
      summary: Chat With Assistant
      description: >
        Streams the assistant's reply to a chat message as Server-Sent Events.
        Events are JSON payloads prefixed with `data:` carrying a `type` field:
        `message.delta` ({text} with the full text so far), `message.completed`
        ({actions, follow_ups}), and `error` ({error}). The current
        implementation streams mocked replies; the AI transport replaces the
        reply source later without changing this contract.
      operationId: chatWithAssistant
      x-ai-danger: "SSE stream - long-lived, incompatible with request/response tools."
      tags: [Assistant]
      security:
        - BearerAuth: []
      requestBody:
        description: The chat message and its conversation scope.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantChatRequest"
      responses:
        "200":
          description: Server-Sent Events stream of assistant reply events.
          content:
            text/event-stream:
              schema:
                type: string
                description: Stream of JSON event payloads prefixed with `data:`.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
