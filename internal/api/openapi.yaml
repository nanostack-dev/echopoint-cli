  /flows/{id}/versions/{versionId}/restore:
    parameters:
      - name: id
        in: path
        required: true
        description: The unique identifier of the flow.
        schema:
          type: string
          format: uuid
      - name: versionId
        in: path
        required: true
        description: The unique identifier of the flow version to restore.
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/RequiredOrganizationIDHeader"
    post:
      summary: Restore Flow Version
      description: |
        Copies a saved version's definition and metadata back into the flow.
        The original version is preserved.
      operationId: restoreFlowVersion
      tags: [Flows]
      security:
        - BearerAuth: [flows:update]
      responses:
        "200":
          description: Flow restored from version successfully.
          content:
            application/json:
              schema:
